meters:
- name: input_tokens
  description: Tokens sent in chat / text completion requests, billed per 1M tokens per model.
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - model
  - api
- name: output_tokens
  description: Tokens generated, billed per 1M tokens per model.
  unit: tokens
  aggregation: sum
  dimensions:
  - account
  - model
  - api
- name: images
  description: Images generated, billed per image per image model.
  unit: images
  aggregation: sum
  dimensions:
  - account
  - model
- name: search_requests
  description: Search queries, billed per request.
  unit: requests
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Pull Targon usage and billing data; inspect per-model token burn across the marketplace.
- name: Allocation
  description: Tag API keys per workload/team; map to internal cost centers.
- name: Optimization
  description: Pick smaller open models when sufficient; exploit promotional free-tier periods; monitor market-driven per-model rates and route to cheaper-capacity models.
- name: Accountability
  description: Assign owners per project/key; review token spend monthly against budget.
maintainers:
