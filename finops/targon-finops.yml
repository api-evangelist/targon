description: >-
  FinOps view of Targon spend. Targon bills usage-based per-token rates for
  chat and text completions, per-image rates for image generation, and
  per-request rates for search. Inference is produced by a decentralized
  marketplace of miners on Bittensor Subnet 4, so per-model rates are
  market-driven and can change over time. Specific rates are not reconciled in
  this artifact.
notes: >-
  Per-model token rates are set by the Subnet 4 marketplace and change over
  time; verify against the Targon console during reconciliation. Account for
  promotional free-tier periods when modeling spend.
