name: Targon
kind: company
description: Targon is a decentralized AI inference platform operated as Bittensor
  Subnet 4 by Manifold Labs. It serves popular open models through an OpenAI-compatible
  REST API at https://api.targon.com/v1, where a marketplace of miners runs the
  inference and validators verify responses, giving developers chat, completions,
  image, and search endpoints over confidential, decentralized compute.
